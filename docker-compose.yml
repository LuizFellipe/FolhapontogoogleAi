version: '3.8'

services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: ghcr.io/luizfellipe/folhaponto-db:latest
    container_name: folhaponto-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-folhaponto_db}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - folhaponto-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: folhaponto-backend
    restart: always
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - DB_NAME=${DB_NAME:-folhaponto_db}
      - API_PORT=${API_PORT:-5000}
      - FLASK_DEBUG=false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - folhaponto-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: folhaponto-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - folhaponto-network

networks:
  folhaponto-network:
    driver: bridge

volumes:
  mysql_data:
